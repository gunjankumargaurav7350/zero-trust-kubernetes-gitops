name: Payment Service CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/payment-service/**'
      - 'gitops/apps/payment-service/**'
      - '.github/workflows/payment-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/payment-service/**'
      - 'gitops/apps/payment-service/**'
      - '.github/workflows/payment-service-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/payment-service/requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 apps/payment-service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: |
          pytest apps/payment-service/tests

  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t payment-service:v1.0.0 apps/payment-service

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'payment-service:v1.0.0'
          format: 'table'
          exit-code: 0
