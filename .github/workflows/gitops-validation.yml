name: Zero-Trust GitOps Manifest & Policy Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate-gitops:
    name: Kubeconform & Kyverno Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.3/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests Syntax
        run: |
          kubeconform -summary -ignore-missing-schemas gitops/apps/

      - name: Enforce Zero-Trust Pod Security Standards
        run: |
          echo "Validating that no containers run as root..."
          grep -rn "runAsNonRoot: true" gitops/apps/ || (echo "Violation: runAsNonRoot must be set to true!" && exit 1)
