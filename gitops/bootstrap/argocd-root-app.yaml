apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-enterprise-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gunjankumargaurav7350/zero-trust-kubernetes-gitops.git
    targetRevision: HEAD
    path: gitops/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
