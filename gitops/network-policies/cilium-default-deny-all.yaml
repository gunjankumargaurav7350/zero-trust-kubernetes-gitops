apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "zero-trust-default-deny-all"
spec:
  description: "Global Zero-Trust baseline: Default deny all ingress and egress across all pods unless explicitly whitelisted."
  nodeSelector: {}
  endpointSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: ["kube-system", "cilium"]}
  ingress: []
  egress:
    # Explicitly permit DNS resolution only to kube-system CoreDNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "kube-system"
            "k8s:k8s-app": "kube-dns"
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
