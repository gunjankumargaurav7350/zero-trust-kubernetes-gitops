apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-payment-secrets
  namespace: payments
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000" # User Assigned Identity client ID
    keyvaultName: "kv-payment-prod-01"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: payment-db-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: stripe-api-private-key
          objectType: secret
          objectVersion: ""
    tenantId: "00000000-0000-0000-0000-000000000000"
